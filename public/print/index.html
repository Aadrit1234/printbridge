<!doctype html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="description" content="Print here — enter the printer's code, add your document, get a token. No account, no app, no queue.">
<title>Print here · PrintBridge</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="./print.css">
<script src="/config.js"></script>
<script>
  /* The theme is decided before the first paint so nobody sees a flash of the
   * wrong one: the person's own choice first, then what the device asked for.
   * The choice is shared with the main site and the admin console (pb.theme,
   * where 'system' means "ask the device"), and here it is drawn as day/dusk. */
  (function () {
    try {
      var saved = localStorage.getItem('pb.theme');
      var dark = saved === 'dark' || (saved !== 'light' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
      document.documentElement.setAttribute('data-theme', dark ? 'dusk' : 'day');
    } catch (e) { /* private mode — the default stands */ }
  })();
</script>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
  <span class="weave"></span>
  <span class="noise"></span>
</div>

<div class="app" id="app">

  <header class="topbar">
    <a class="brand" href="/" title="PrintBridge">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8V4h12v4"/>
          <rect x="3" y="8" width="18" height="8" rx="2.4"/>
          <path d="M6.5 12h5"/>
          <path d="M17.5 12v.01"/>
          <path d="M9 16h6"/>
        </svg>
      </span>
      <span class="brand-words">
        <strong>PrintBridge</strong>
        <em>walk-up printing</em>
      </span>
    </a>

    <div class="top-actions">
      <button class="printer-chip" id="printer-chip" type="button" hidden>
        <span class="chip-dot" aria-hidden="true"></span>
        <span class="chip-body">
          <span class="chip-name" id="chip-name">—</span>
          <span class="chip-code" id="chip-code"></span>
        </span>
        <span class="chip-swap" id="chip-swap">change</span>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark">
        <span class="icon-btn-glyph" id="theme-glyph" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <section class="progress" id="progress" aria-label="Progress" hidden>
    <div class="progress-head">
      <span class="progress-count" id="progress-count">Step 1 of 5</span>
      <span class="progress-name" id="progress-name">Printer code</span>
      <span class="progress-printer mono" id="progress-printer"></span>
    </div>
    <ol class="pips" id="pips"></ol>
  </section>

  <main class="stages" id="stages">
    <section class="stage" id="step-code" aria-labelledby="h-code"></section>
    <section class="stage" id="step-mode" hidden></section>
    <section class="stage" id="step-details" hidden></section>
    <section class="stage" id="step-upload" hidden></section>
    <section class="stage" id="step-settings" hidden></section>
    <section class="stage" id="step-payment" hidden></section>
    <section class="stage" id="step-token" hidden></section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="./print.js"></script>
<script>
  /* Installable for the people who use the same printer all day. Failures are
   * silent: a service worker is a nicety, never a requirement. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
